# Конфигурация Nginx для сайта LOG Studio
# Сохраните этот файл на сервере в: /etc/nginx/sites-available/logstudio
# И создайте симлинк: sudo ln -s /etc/nginx/sites-available/logstudio /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    
    # Укажите ваш домен или поддомен (например: download.mysite.com или logstudio.app)
    server_name YOUR_DOMAIN.COM www.YOUR_DOMAIN.COM;

    # Путь к папке сайта на сервере
    root /var/www/logstudio;
    index index.html;

    # Логи
    access_log /var/log/nginx/logstudio_access.log;
    error_log /var/log/nginx/logstudio_error.log;

    # Оптимизация отдачи статики и больших файлов (.dmg)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip сжатие для HTML, CSS, JS (не сжимает .dmg, так как dmg уже сжат)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Обработка скачивания DMG
    location /downloads/ {
        alias /var/www/logstudio/downloads/;
        # Корректный MIME-тип для образов macOS
        types {
            application/x-apple-diskimage dmg;
        }
        add_header Content-Disposition 'attachment';
        add_header Cache-Control "public, max-age=86400";
    }

    # Кэширование ассетов (иконка, картинки, стили)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Основной роутинг
    location / {
        try_files $uri $uri/ =404;
    }
}
